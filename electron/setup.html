<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'" />
  <title>ImmichExt — Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111827;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      user-select: none;
    }

    .card { width: 100%; max-width: 440px; }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f9fafb;
      margin-bottom: 6px;
    }

    p {
      font-size: 0.82rem;
      color: #9ca3af;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    label {
      font-size: 0.78rem;
      font-weight: 500;
      color: #d1d5db;
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #f3f4f6;
      font-size: 0.9rem;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]:focus { border-color: #4f8ef7; }

    button {
      width: 100%;
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      background: #4f8ef7;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #3b7de0; }
    button:active { background: #2d6bc9; }

    .error {
      color: #f87171;
      font-size: 0.8rem;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to ImmichExt</h1>
    <p>Enter the base URL of your Immich server. This is saved locally and can be changed later.</p>

    <label for="url">Immich Server URL</label>
    <input
      id="url"
      type="url"
      placeholder="http://192.168.1.10:2283"
      value="http://localhost:2283"
      autocomplete="off"
      spellcheck="false"
    />

    <button id="btn">Connect</button>
    <div class="error" id="error">Please enter a valid URL starting with http:// or https://</div>
  </div>

  <script>
    const input = document.getElementById('url')
    const btn = document.getElementById('btn')
    const error = document.getElementById('error')

    function submit() {
      const val = input.value.trim()
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        error.style.display = 'block'
        input.focus()
        return
      }
      error.style.display = 'none'
      btn.disabled = true
      btn.textContent = 'Connecting…'
      window.electronConfig.submit(val)
    }

    btn.addEventListener('click', submit)
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit() })
    input.select()
  </script>
</body>
</html>
